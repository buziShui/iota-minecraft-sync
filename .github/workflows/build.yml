name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: corepack enable && pnpm install --frozen-lockfile && pnpm build
        working-directory: mslx-plugin-iota-sync/Frontend
      - run: dotnet build MSLX.Plugin.IotaSync.csproj -c Release
        working-directory: mslx-plugin-iota-sync
      - uses: actions/upload-artifact@v4
        with:
          name: mslx-plugin-iota-sync
          path: mslx-plugin-iota-sync/bin/Release/net10.0/MSLX.Plugin.IotaSync.dll
  pcl-io:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild "pcl-io\Plain Craft Launcher 2.sln" /restore /p:Configuration=Release /m
      - uses: actions/upload-artifact@v4
        with:
          name: pcl-io
          path: pcl-io/Plain Craft Launcher 2/bin/*.exe
